[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-sales-supply-chain-planning-agent"
version = "0.1.0"
description = "Local incremental ETL and scoped retrieval prototype for manufacturing sales and risk"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
snowflake = ["snowflake>=0.8,<2", "snowflake-connector-python>=3,<5"]
gmail = ["google-api-python-client>=2,<3", "google-auth-httplib2>=0.2,<1"]

[tool.setuptools.packages.find]
include = ["app*", "pipelines*", "rag*", "scripts*", "integrations*"]
exclude = ["tests*"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "artifacts", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
