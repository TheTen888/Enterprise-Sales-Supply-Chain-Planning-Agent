name: Local verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALLOW_LIVE_SERVICES: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install lint tool
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Check Python source
        run: python -m ruff check --no-cache app pipelines rag integrations scripts tests
      - name: Verify local ETL and RAG
        run: python -m scripts.verify
      - name: Review release files
        run: python -m scripts.release_check
